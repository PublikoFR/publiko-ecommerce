services:
    app:
        build:
            context: ./docker/app
            dockerfile: Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: weklo-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/zz-weklo.ini:ro
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
            PHP_IDE_CONFIG: serverName=weklo
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
            mailpit:
                condition: service_started
        networks:
            - backend
            - traefik_network
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik_network
            - traefik.http.routers.weklo.rule=Host(`weklo.localhost`)
            - traefik.http.routers.weklo.entrypoints=web
            - traefik.http.services.weklo.loadbalancer.server.port=80

    # Équivalent Docker du cron `* * * * * php artisan schedule:run` de la prod.
    # `routes/console.php` y planifie TOUT le travail de fond : le worker de file
    # (l'hébergement mutualisé n'a pas de Supervisor, cf. le commentaire sur place),
    # le polling de suivi transporteur et l'AI importer. Sans ce service, rien de
    # tout cela ne tourne en local — les jobs s'empilent sans la moindre erreur
    # visible, et le suivi des colis ne se met jamais à jour.
    scheduler:
        build:
            context: ./docker/app
            dockerfile: Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        container_name: weklo-scheduler
        restart: unless-stopped
        working_dir: /var/www/html
        user: sail
        volumes:
            - .:/var/www/html
            - ./docker/app/php.ini:/usr/local/etc/php/conf.d/zz-weklo.ini:ro
        environment:
            APP_ENV: ${APP_ENV:-local}
            APP_DEBUG: ${APP_DEBUG:-true}
        # `schedule:work` = boucle qui appelle `schedule:run` chaque minute, sans cron
        # à installer dans l'image. Chaque tick relance un process neuf : le code est
        # toujours à jour, contrairement à un `queue:work` résident qui garderait en
        # mémoire l'ancienne version d'un job jusqu'au redémarrage du conteneur.
        # Contrepartie assumée : jusqu'à une minute de latence avant qu'un job parte,
        # exactement comme en production.
        command: php artisan schedule:work
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - backend

    mysql:
        image: mysql:8.0
        container_name: weklo-mysql
        restart: unless-stopped
        command: --default-authentication-plugin=caching_sha2_password
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
            MYSQL_DATABASE: ${DB_DATABASE:-weklo}
            MYSQL_USER: ${DB_USERNAME:-weklo}
            MYSQL_PASSWORD: ${DB_PASSWORD:-app_password}
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/zz-weklo.cnf:ro
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-root_password}']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: weklo-redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - backend

    # Catcher SMTP local (docs/architecture.md) — MAIL_HOST=mailpit dans .env
    # pointe vers ce service. Sans lui, Mail::send() échoue silencieusement
    # côté queue ou lève une erreur de connexion SMTP non visible dans l'UI :
    # aucun mail (contact, commande, etc.) n'arrive jamais en local.
    mailpit:
        image: axllent/mailpit:latest
        container_name: weklo-mailpit
        restart: unless-stopped
        networks:
            - backend
            - traefik_network
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik_network
            - traefik.http.routers.weklo-mailpit.rule=Host(`mailpit.weklo.localhost`)
            - traefik.http.routers.weklo-mailpit.entrypoints=web
            - traefik.http.services.weklo-mailpit.loadbalancer.server.port=8025

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: weklo-pma
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            PMA_USER: root
            PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
            UPLOAD_LIMIT: 256M
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - backend
            - traefik_network
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik_network
            - traefik.http.routers.weklo-pma.rule=Host(`pma.weklo.localhost`)
            - traefik.http.routers.weklo-pma.entrypoints=web
            - traefik.http.services.weklo-pma.loadbalancer.server.port=80

networks:
    backend:
        driver: bridge
    traefik_network:
        external: true

volumes:
    mysql_data:
        driver: local
    redis_data:
        driver: local
