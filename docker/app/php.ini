; Laravel PHP overrides
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 256M
upload_max_filesize = 128M
max_input_vars = 10000
date.timezone = Europe/Paris

; OPcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Errors (dev)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Session
session.gc_maxlifetime = 7200

; Protection stack-overflow (auto-detectee depuis RLIMIT_STACK, donc SAPI-safe :
; ~8 Mo en apache, ~64 Mo en CLI de test ou run-tests-chunked.sh releve ulimit -s).
; Convertit un depassement de pile (recursion userland) en \Error catchable AVEC
; stack trace au lieu d'un SIGSEGV silencieux. Diagnostic du signal 11 au shutdown.
zend.max_allowed_stack_size = -1
